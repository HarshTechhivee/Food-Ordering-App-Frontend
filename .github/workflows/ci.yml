
name: Frontend CI

on:
  push:
    branches:
      - development
      - feature/webpack-setup
  pull_request:
    branches:
      - development
      - feature/webpack-setup

jobs:
  frontend-checks:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
      
      - name: Upload Webpack production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-webpack-dist
          path: dist-webpack/
          if-no-files-found: error
          retention-days: 7

